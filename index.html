<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonlit Coffee</title>

            </div>
        </div>
    </header>
    <main class="main">
        <section class="hero">
            <div class="hero__container">
                <div class="hero__infos">
                    <p class="hero__infos-marca">MOONLIT COFFEE</p>
                    <h1 class="hero__infos-title">Where coffee meets <span class="title__destaque">Moonlight.</span></h1>
                    <div class="hero__infos-decoration-line"></div>
                    <p class="hero__infos-subtitle">Crafted with passion, served with warmth.</p>
                    <p class="hero__infos-complementar">Discover handcrafted coffee made for your quiet moments.</p>
                    <div class="infos__buttons">
                        <button class="infos__button-menu"><svg class="icon__coffee" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M96 128C96 110.3 110.3 96 128 96L480 96C550.7 96 608 153.3 608 224C608 294.7 550.7 352 480 352C480 405 437 448 384 448L192 448C139 448 96 405 96 352L96 128zM544 224C544 188.7 515.3 160 480 160L480 288C515.3 288 544 259.3 544 224zM96 512L480 512C497.7 512 512 526.3 512 544C512 561.7 497.7 576 480 576L96 576C78.3 576 64 561.7 64 544C64 526.3 78.3 512 96 512z"/></svg><span class="menu__text">Explore Our Menu</span></button>

                    </div>
                </div>
            </div>
        </section>

</html>
